[tool.poetry]
name = "deeplearn-course"
version = "0.1.0"
description = "CS5242 Deep Learning course environment"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "~3.8"
numpy = "1.24.*"
pandas = "2.0.*"
scipy = "1.10.1"
matplotlib = "3.7.*"
seaborn = "0.13.*"
networkx = "3.1.*"
ipython = "8.12.*"
jupyter = "1.0.*"
rdkit = "2023.9.6"
gym = "0.26.*"
# PyTorch — standard PyPI wheels include MPS (Apple Silicon) support
torch = "2.1.2"
torchvision = "0.16.*"
torchaudio = "2.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
